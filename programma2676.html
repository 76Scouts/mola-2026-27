<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Μόλα 76ου Σ.Π. Στροβόλου 2026-2027</title>
<style>
:root{--gold:#8F6B00;--green:#3D5F26;--red:#900000;--blue:#15558F;--sch:#37145A;--gen:#6D3BB5;--nat:#5A5A5A;--camp:#0A5A5A;--badge:#5E2A08;--bd:#dcdcd6;--mut:#6b6b66}
*{box-sizing:border-box}
body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1c1c1a;margin:0;background:#e9efe6;font-size:13px}
header{padding:14px 18px;background:#f4f8f1;border-bottom:2px solid #3D5F26;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0 0 8px;font-weight:600;color:#2b3a1c}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gl{font-size:12px;color:var(--mut);font-weight:500;margin-right:2px}
.sep{width:1px;height:16px;background:var(--bd);margin:0 4px;display:inline-block}
.btn{padding:5px 11px;border:1px solid var(--bd);border-radius:7px;background:#fff;cursor:pointer;font-size:12px}
.btn:hover{background:#f0efe9}
.btn.act{background:#1c1c1a;color:#fff;border-color:#1c1c1a}
.btn.pri{background:var(--gen);color:#fff;border-color:var(--gen)}
.count{margin-left:auto;color:var(--mut);font-size:12px}
main{display:flex;gap:0;align-items:flex-start}
aside{width:210px;flex:none;padding:12px;position:sticky;top:80px;max-height:calc(100vh - 80px);overflow:auto;border-right:1px solid var(--bd);background:#f4f8f1}
.cat{margin:0 0 3px}
.catline{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;cursor:pointer}
.catline:hover{background:#efeee8}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.catname{flex:1;font-weight:500}
.catn{color:var(--mut);font-size:11px}
.exp{cursor:pointer;color:var(--mut);width:14px;text-align:center;user-select:none}
.subs{margin:0 0 4px 22px}
.subline{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:5px;cursor:pointer;font-size:12px;color:#333}
.subline:hover{background:#efeee8}
.wrap{flex:1;padding:12px 16px;overflow:auto}
.month{margin:0 0 13px}
.mlabel{display:inline-block;background:#eef3ea;color:#2b3a1c;padding:2px 11px;border-radius:12px;font-weight:700;font-size:12px;letter-spacing:.02em;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{background:#fff;border:1px solid #e4e4de;border-radius:9px;padding:5px 7px;min-height:50px;box-shadow:0 1px 2px rgba(20,30,20,.05)}
.cd{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#1f2a16;margin:0 0 4px;padding-bottom:3px;border-bottom:1px solid #eef0ec}
.addb{border:none;background:none;color:var(--mut);cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.addb:hover{color:var(--blue)}
.ent{display:flex;gap:5px;align-items:flex-start;font-size:12px;line-height:1.32;padding:2px 5px;border-radius:5px;margin:0 0 2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ent.geband{background:#e9edf1;border-radius:4px;padding:1px 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ent.off .lab{opacity:.32;text-decoration:line-through}
.ent input{margin:2px 0 0;flex:none}
.lab{cursor:pointer;flex:1}
.chip{font-size:9px;padding:0 4px;border:1px solid;border-radius:8px;margin-left:3px;white-space:nowrap;vertical-align:1px}
.pen{cursor:pointer;color:var(--mut);font-size:13px;padding:0 4px;visibility:visible}
body.edit .pen{visibility:visible}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:12px;padding:18px;width:420px;max-width:92vw;max-height:88vh;overflow:auto}
.box h3{margin:0 0 10px;font-size:15px}
.tagrow{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:12px;font-size:12px;color:#fff}
.tag b{cursor:pointer;font-weight:400}
select,input[type=text]{padding:5px 7px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:inherit}
.hint{color:var(--mut);font-size:11px;margin:2px 0 8px}
.mobonly{display:none}
@media(max-width:760px){
 .mobonly{display:inline-flex;align-items:center}
 header{position:static;padding:10px 12px}
 h1{font-size:15px;line-height:1.25}
 header .row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px}
 header .row::-webkit-scrollbar{height:0}
 header .btn{padding:7px 11px;font-size:13px}
 .count{margin-left:8px;flex:none}
 main{flex-direction:column}
 aside{width:auto;position:static;max-height:46vh;border-right:none;border-bottom:1px solid var(--bd);display:none}
 body.showfilters aside{display:block}
 .wrap{padding:8px 10px;overflow:visible}
 .grid{grid-template-columns:repeat(2,1fr);gap:5px}
 .cell{min-height:auto}
 .mlabel{font-size:13px;color:#2b3a1c}
 .ent{font-size:13px}
 .pen{font-size:16px;padding:0 6px}
 .box{padding:16px 14px}
}
@media(max-width:520px){
 .grid{grid-template-columns:1fr}
}
@media print{
 header .row,aside,.addb,.pen,.actions{display:none!important}
 header{position:static;border:none}aside{display:none}
 .ent.off{display:none}.ent input{display:none}
 body{background:#fff;font-size:10px}.wrap{padding:0}
 .grid{gap:3px}.cell{min-height:40px}
 @page{size:A4 landscape;margin:10mm}
}
</style>
</head>
